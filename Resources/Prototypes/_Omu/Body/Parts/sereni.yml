- type: entity
  id: PartSereni
  parent: [BaseItem, BasePart]
  name: "sereni body part"
  abstract: true
  components:
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 3
      - ReagentId: Blood
        Quantity: 10
  - type: Damageable
    damageModifierSet: Sereni

